<body>
  <header class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-top">
          <span class="brand-badge">PRO</span>
          <span>DOCX STUDIO</span>
        </div>
        <span class="brand-sub">All-in-One Image, Photo Retouch &amp; PDF Toolkit</span>
      </div>
      <nav class="menu">
        <a href="index.html" class="menu-btn">Image Resizer</a>
        <a href="passport.html" class="menu-btn">Passport Photo</a>

        <a href="pdf-form.html" class="menu-btn active">PDF Form Filler</a>
        <a href="join-edit.html" class="menu-btn">Join, Edit & Create</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="tab-pdf-form" class="panel active">
      <h1>PDF Form Filling Tool (Auto-Detect Fillable Fields &amp; Visual Form Fill)</h1>
      <div class="inputs-row">
        <label>Upload PDF Form: <input type="file" id="ffPdfFile" accept="application/pdf"></label>
        <label>Open Password (if locked): <input type="password" id="ffOpenPass" placeholder="Enter PDF password"></label>
        <button type="button" class="btn-green" id="ffLoadBtn">Open / Detect Form Fields</button>
      </div>
      <div class="inputs-row">
        <label>Font (Eng/Hin/Punjabi): <select class="font-selector-100" id="ffFontFamily" style="max-width:210px;"></select></label>
        <label><input type="checkbox" id="ffBoldToggle" checked> <strong>Bold</strong></label>
        <label><input type="checkbox" id="ffFlatten" checked> Lock / Flatten Fields After Filling</label>
        <label>Set Output Password: <input type="password" id="ffPassword" placeholder="Optional"></label>
      </div>

      <div id="ffStatus" class="status-note hidden"></div>
      <div id="ffFieldsContainer" class="form-fields-grid"></div>

      <div id="ffVisualWrap" class="hidden">
        <div class="inputs-row">
          <label>Page: <select id="ffPageSelect"></select></label>
          <label>Text to Place on Form: <input type="text" id="ffVisText" placeholder="Type name, date, ✓ etc."></label>
          <label>Font Size: <input type="number" id="ffVisSize" value="15" min="8" max="48" style="width:65px;"></label>
          <button type="button" class="chip" id="ffUndoVisBtn">Undo Last Text</button>
        </div>
        <div class="canvas-box">
          <canvas id="ffCanvas" class="interactive"></canvas>
        </div>
      </div>

      <div class="controls-row">
        <button type="button" class="btn-blue hidden" id="ffSaveBtn">Fill &amp; Download PDF Form</button>
      </div>
      <div class="output-area" id="ffOutput"></div>
    </section>
  </main>

  <script src="js/shared.js"></script>
  <script src="js/pdf-form.js"></script>
</body>
</html>
